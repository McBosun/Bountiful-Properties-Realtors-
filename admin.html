<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bountiful Admin</title>
<style>
:root{--bg:#f2f9ff;--ink:#0b2540;--mut:#58708a;--card:#ffffff;--line:#d3e7f7;--gold:#0284c7;--grn:#0369a1;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071a2b;--ink:#eaf6ff;--mut:#8fb2cc;--card:#0d2740;--line:#1c3f5e;--gold:#38bdf8;--grn:#38bdf8;--on:#04121f}}
:root[data-theme="dark"]{--bg:#071a2b;--ink:#eaf6ff;--mut:#8fb2cc;--card:#0d2740;--line:#1c3f5e;--gold:#38bdf8;--grn:#38bdf8;--on:#04121f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.01em}
.wrap{max-width:880px;margin:0 auto;padding:16px}
nav{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
.logo{display:flex;gap:10px;align-items:center;font-family:Georgia,serif;font-weight:700}
.logo i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--grn));display:grid;place-items:center;color:#fff;font-style:normal}
.hero{background:linear-gradient(160deg,#38bdf8,#0369a1);color:#fff;border-radius:22px;padding:28px 22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:30px solid rgba(255,255,255,.22)}
.hero h1{font-size:clamp(28px,7vw,44px);line-height:1.1;margin:0 0 10px}
.hero .btn{background:#fff;color:#0369a1}
.hero p{margin:0 0 18px;opacity:.9;max-width:520px}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--grn);color:var(--on);font:600 16px system-ui,sans-serif;padding:12px 20px;border-radius:12px}
.btn.alt{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:14px}
.split{display:flex;height:46px;border-radius:12px;overflow:hidden;margin:16px 0 8px;font-weight:700;font-size:14px}
.split div{display:grid;place-items:center;color:#fff}
.s6{flex:6;background:#0369a1}.s1{flex:1;background:#38bdf8}.s3{flex:3;background:#1e3a5f}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ph{height:110px;border-radius:12px;margin-bottom:10px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:600;font-size:13px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:99px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--grn);color:var(--on);border-color:var(--grn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:700 20px Georgia,serif;color:var(--gold)}.stat span{font-size:12px;color:var(--mut)}
.link{word-break:break-all;background:var(--bg);border:1px dashed var(--gold);padding:10px;border-radius:10px;font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mut{color:var(--mut);font-size:14px}
#agreement{background:#fff;color:#111;border:1px solid #ccc;padding:28px;font-family:Georgia,serif;border-radius:6px;line-height:1.55}
#agreement h2{text-align:center;margin:0 0 4px}#agreement table{width:100%;border-collapse:collapse;margin:10px 0}
#agreement td{border:1px solid #999;padding:6px 10px}
.ib{background:var(--card);border:1px solid var(--line);color:var(--ink);width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;border:0;background:var(--grn);color:var(--on);font:700 16px Georgia,serif;cursor:pointer}.av.big{width:56px;height:56px;font-size:22px;cursor:default;margin-bottom:8px;display:grid;place-items:center}
.dd{position:relative}.ddm{position:absolute;right:0;top:48px;background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:180px;box-shadow:0 8px 24px rgba(3,105,161,.2);z-index:30;overflow:hidden}
.ddm a,.sb a{display:block;padding:12px 16px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(3,40,70,.45);opacity:0;pointer-events:none;transition:.2s;z-index:40}.ov.open{opacity:1;pointer-events:auto}
.sb{position:fixed;top:0;bottom:0;left:0;width:280px;max-width:84vw;background:var(--card);z-index:50;transform:translateX(-100%);transition:.25s;padding:calc(env(safe-area-inset-top,0px) + 20px) 8px 20px;overflow-y:auto}.sb.open{transform:none}
.sb a.on{background:var(--bg);color:var(--grn);font-weight:600;border-radius:10px}
.sbh{padding:0 12px 14px;margin-bottom:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column}
@media print{.nopr,#app>*:not(#print-root){display:none!important}#print-root{display:block!important}#agreement{border:0;padding:0}.wrap{padding:0}}
</style></head><body><div class="wrap" id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== Paste your Firebase web config here (same values as index.html) =====
const FB={apiKey:'AIzaSyC14mGPKPreUk1GeuJ8QPzit2qz8_uKOIk',authDomain:'bountiful-realtors.firebaseapp.com',projectId:'bountiful-realtors',appId:'1:853837062187:web:95f51a16304eb1f0c14a6e'};
// ===========================================================================
const SETUP=FB.apiKey.startsWith('PASTE');
if(!SETUP)firebase.initializeApp(FB);
const au=SETUP?null:firebase.auth(),db=SETUP?null:firebase.firestore();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(+n||0).toLocaleString('en-US');
const A=s=>s.docs.map(d=>({id:d.id,...d.data()}));
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const r2=n=>Math.round(n*100)/100;
let P=null,tab='ov',D={sales:[],listings:[],people:[]};
function msg(m){const x=$('#msg');if(x){x.textContent=m;x.style.color='#b3261e'}}
async function login(){if(SETUP)return msg('Add your Firebase config first (see README).');
 try{await au.signInWithEmailAndPassword($('#e').value.trim(),$('#pw').value)}catch(x){return msg(x.message)}await enter()}
async function enter(){const u=au.currentUser;if(!u)return;
 let ok=false;try{ok=(await db.collection('admins').doc(u.uid).get()).exists}catch(e){}
 if(!ok){await au.signOut();P=null;render();return msg('This account is not an admin.')}
 P={id:u.uid,email:u.email};await refresh()}
async function refresh(){try{const [a,b,c]=await Promise.all([db.collection('sales').get(),db.collection('listings').get(),db.collection('profiles').get()]);
 D={sales:A(a).sort((x,y)=>y.created-x.created),listings:A(b).sort((x,y)=>x.created-y.created),people:A(c).sort((x,y)=>y.created-x.created)}}catch(e){alert(e.message)}render()}
async function out(){await au.signOut();P=null;render()}
async function act(id,st){let u={status:st};
 if(st==='confirmed'){const s=D.sales.find(x=>x.id===id),v=prompt('Final sale price (USD)',s.sale_price);if(v===null)return;const p=+v;if(!(p>0))return alert('Enter a valid price');const up=!!s.upline_id;
  u={status:'confirmed',sale_price:p,realtor_amt:r2(p*.06),upline_amt:up?r2(p*.01):0,agency_amt:r2(p*.03+(up?0:p*.01)),confirmed_at:Date.now()}}
 else if(st==='paid'){if(!confirm('Mark commissions as paid?'))return;u={status:'paid',paid_at:Date.now()}}
 else if(!confirm('Reject this closing?'))return;
 try{await db.collection('sales').doc(id).update(u)}catch(e){return alert(e.message)}refresh()}
async function addL(){const r={title:$('#lt').value.trim(),location:$('#ll').value.trim(),kind:$('#lk').value,price:+$('#lp').value,description:$('#ld').value.trim(),status:'active',created:Date.now()};
 if(!r.title||!r.location||!(r.price>0))return alert('Title, location and price are required.');
 try{await db.collection('listings').add(r)}catch(e){return alert(e.message)}refresh()}
async function seed(){const s=[['Palm Crest Terraces','Lekki, Lagos','Ongoing build','4-bed duplexes',185000],['Heritage Land Estate','Abuja, Nigeria','Land','600 sqm plots, C of O',42000],['Azure Bay Apartments','Accra, Ghana','Available','2-bed sea view',128000],['Golden Ridge Villas','Dubai, UAE','Ongoing build','5-bed gated villas',420000],['Savannah Gardens','Nairobi, Kenya','Available','3-bed townhouses',96000],['Kingsway Mews','London, UK','Available','Prime flats',560000]];
 try{for(let i=0;i<s.length;i++)await db.collection('listings').add({title:s[i][0],location:s[i][1],kind:s[i][2],description:s[i][3],price:s[i][4],status:'active',created:Date.now()+i})}catch(e){return alert(e.message)}refresh()}
async function setL(id,st){try{await db.collection('listings').doc(id).update({status:st})}catch(e){alert(e.message)}refresh()}
async function priceL(id){const v=+prompt('New price (USD)');if(!(v>0))return;try{await db.collection('listings').doc(id).update({price:v})}catch(e){alert(e.message)}refresh()}
function csv(){const rows=[['Closing','Property','Realtor','Email','Upline','Sale price','Realtor 6%','Upline 1%','Agency','Status']].concat(D.sales.map(x=>[x.id,x.listing_title,x.realtor_name,x.realtor_email,x.upline_name||'',x.sale_price,x.realtor_amt??'',x.upline_amt??'',x.agency_amt??'',x.status]));
 const t=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='bountiful-closings.csv';a.click()}
function sale(x){const done=x.status==='confirmed'||x.status==='paid';
 return `<div class="card"><div class="row"><b>${esc(x.listing_title)}</b><span class="tag">${x.status}</span></div><div class="mut">${esc(x.realtor_name)} (${esc(x.realtor_email)}) · Upline: ${esc(x.upline_name||'none')}</div><div class="row"><span>Sale price</span><b>${money(x.sale_price)}</b></div>${done?`<div class="row"><span>Realtor 6%</span><b>${money(x.realtor_amt)}</b></div><div class="row"><span>Upline 1%</span><b>${money(x.upline_amt)}</b></div><div class="row"><span>Agency</span><b>${money(x.agency_amt)}</b></div>`:''}${x.status==='pending'?`<br><button class="btn sm" onclick="act('${x.id}','confirmed')">Confirm closing</button> <button class="btn alt sm" onclick="act('${x.id}','rejected')">Reject</button>`:''}${x.status==='confirmed'?`<br><button class="btn sm" onclick="act('${x.id}','paid')">Mark commissions paid</button>`:''}</div>`}
function render(){const a=$('#app');
 if(!P){a.innerHTML=`<nav><div class="logo"><i>B</i>Bountiful Admin</div></nav>${SETUP?'<div class="card" style="border-color:#b3261e"><b>Setup needed.</b> Paste your Firebase config at the top of this file (see README).</div>':''}<div class="card"><h2 style="margin-top:0">Admin sign in</h2><label>Email</label><input id="e" type="email"><label>Password</label><input id="pw" type="password"><p id="msg" style="font-size:14px;min-height:20px"></p><button class="btn" onclick="login()">Log in</button></div>`;return}
 const S=D.sales,ok=S.filter(x=>x.status==='confirmed'||x.status==='paid'),owed=S.filter(x=>x.status==='confirmed'),pd=S.filter(x=>x.status==='paid');let b='';
 if(tab==='ov')b=`<div class="stats"><div class="stat"><b>${D.people.length}</b><span>Realtors</span></div><div class="stat"><b>${S.filter(x=>x.status==='pending').length}</b><span>Pending closings</span></div><div class="stat"><b>${money(sum(ok,x=>x.sale_price))}</b><span>Sales volume</span></div></div><div class="stats" style="margin-top:8px"><div class="stat"><b>${money(sum(ok,x=>x.agency_amt))}</b><span>Agency earned</span></div><div class="stat"><b>${money(sum(owed,x=>+x.realtor_amt+ +x.upline_amt))}</b><span>Owed to realtors</span></div><div class="stat"><b>${money(sum(pd,x=>+x.realtor_amt+ +x.upline_amt))}</b><span>Paid out</span></div></div><h3 class="serif">Latest closings</h3>${S.slice(0,5).map(sale).join('')||'<p class="mut">No closings yet.</p>'}`;
 if(tab==='cl')b=`<button class="btn alt sm" onclick="csv()">Export CSV</button>${S.map(sale).join('')||'<p class="mut">No closings yet.</p>'}`;
 if(tab==='lst')b=`<div class="card"><h3 style="margin-top:0">Add a listing</h3><label>Title</label><input id="lt"><label>Location</label><input id="ll"><label>Type</label><select id="lk"><option>Available</option><option>Ongoing build</option><option>Land</option></select><label>Price (USD)</label><input id="lp" type="number"><label>Description</label><input id="ld"><br><br><button class="btn" onclick="addL()">Add listing</button> ${D.listings.length?'':'<button class="btn alt" onclick="seed()">Load 6 sample listings</button>'}</div>${D.listings.map(p=>`<div class="card"><div class="row"><b>${esc(p.title)}</b><span class="tag">${p.status}</span></div><div class="mut">${esc(p.location)} · ${esc(p.kind)} · ${money(p.price)}</div><br><button class="btn alt sm" onclick="priceL('${p.id}')">Edit price</button> ${p.status!=='active'?`<button class="btn alt sm" onclick="setL('${p.id}','active')">Activate</button>`:`<button class="btn alt sm" onclick="setL('${p.id}','sold')">Mark sold</button>`} ${p.status!=='archived'?`<button class="btn alt sm" onclick="setL('${p.id}','archived')">Archive</button>`:''}</div>`).join('')}`;
 if(tab==='ppl')b=D.people.map(x=>`<div class="card"><div class="row"><b>${esc(x.full_name)}</b></div><div class="mut">${esc(x.email)} · ${esc(x.country||'')}<br>Code ${esc(x.referral_code)} · Upline: ${esc(x.upline_name||'none')} · ${esc(x.agreement_no)}</div></div>`).join('')||'<p class="mut">No realtors yet.</p>';
 a.innerHTML=`<nav><div class="logo"><i>B</i>Bountiful Admin</div><button class="btn alt sm" onclick="out()">Sign out</button></nav><div class="tabs">${[['ov','Overview'],['cl','Closings'],['lst','Listings'],['ppl','Realtors']].map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${b}`}
if(SETUP)render();else au.onAuthStateChanged(u=>{u?enter():render()});

</script></body></html>

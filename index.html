<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bountiful Properties · Realtor Network</title>
<style>
:root{--bg:#f2f9ff;--ink:#0b2540;--mut:#58708a;--card:#ffffff;--line:#d3e7f7;--gold:#0284c7;--grn:#0369a1;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071a2b;--ink:#eaf6ff;--mut:#8fb2cc;--card:#0d2740;--line:#1c3f5e;--gold:#38bdf8;--grn:#38bdf8;--on:#04121f}}
:root[data-theme="dark"]{--bg:#071a2b;--ink:#eaf6ff;--mut:#8fb2cc;--card:#0d2740;--line:#1c3f5e;--gold:#38bdf8;--grn:#38bdf8;--on:#04121f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.01em}
.wrap{max-width:880px;margin:0 auto;padding:16px}
nav{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
.logo{display:flex;gap:10px;align-items:center;font-family:Georgia,serif;font-weight:700}
.logo i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--grn));display:grid;place-items:center;color:#fff;font-style:normal}
.hero{background:linear-gradient(160deg,#38bdf8,#0369a1);color:#fff;border-radius:22px;padding:28px 22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:30px solid rgba(255,255,255,.22)}
.hero h1{font-size:clamp(28px,7vw,44px);line-height:1.1;margin:0 0 10px}
.hero .btn{background:#fff;color:#0369a1}
.hero p{margin:0 0 18px;opacity:.9;max-width:520px}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--grn);color:var(--on);font:600 16px system-ui,sans-serif;padding:12px 20px;border-radius:12px}
.btn.alt{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:14px}
.split{display:flex;height:46px;border-radius:12px;overflow:hidden;margin:16px 0 8px;font-weight:700;font-size:14px}
.split div{display:grid;place-items:center;color:#fff}
.s6{flex:6;background:#0369a1}.s1{flex:1;background:#38bdf8}.s3{flex:3;background:#1e3a5f}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ph{height:110px;border-radius:12px;margin-bottom:10px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:600;font-size:13px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:99px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--grn);color:var(--on);border-color:var(--grn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:700 20px Georgia,serif;color:var(--gold)}.stat span{font-size:12px;color:var(--mut)}
.link{word-break:break-all;background:var(--bg);border:1px dashed var(--gold);padding:10px;border-radius:10px;font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mut{color:var(--mut);font-size:14px}
#agreement{background:#fff;color:#111;border:1px solid #ccc;padding:28px;font-family:Georgia,serif;border-radius:6px;line-height:1.55}
#agreement h2{text-align:center;margin:0 0 4px}#agreement table{width:100%;border-collapse:collapse;margin:10px 0}
#agreement td{border:1px solid #999;padding:6px 10px}
.ib{background:var(--card);border:1px solid var(--line);color:var(--ink);width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;border:0;background:var(--grn);color:var(--on);font:700 16px Georgia,serif;cursor:pointer}.av.big{width:56px;height:56px;font-size:22px;cursor:default;margin-bottom:8px;display:grid;place-items:center}
.dd{position:relative}.ddm{position:absolute;right:0;top:48px;background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:180px;box-shadow:0 8px 24px rgba(3,105,161,.2);z-index:30;overflow:hidden}
.ddm a,.sb a{display:block;padding:12px 16px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(3,40,70,.45);opacity:0;pointer-events:none;transition:.2s;z-index:40}.ov.open{opacity:1;pointer-events:auto}
.sb{position:fixed;top:0;bottom:0;left:0;width:280px;max-width:84vw;background:var(--card);z-index:50;transform:translateX(-100%);transition:.25s;padding:calc(env(safe-area-inset-top,0px) + 20px) 8px 20px;overflow-y:auto}.sb.open{transform:none}
.sb a.on{background:var(--bg);color:var(--grn);font-weight:600;border-radius:10px}
.sbh{padding:0 12px 14px;margin-bottom:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column}
@media print{.nopr,#app>*:not(#print-root){display:none!important}#print-root{display:block!important}#agreement{border:0;padding:0}.wrap{padding:0}}
</style></head><body><div class="wrap" id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ===== Firebase web config =====
const FB={apiKey:'AIzaSyC14mGPKPreUk1GeuJ8QPzit2qz8_uKOIk',authDomain:'bountiful-realtors.firebaseapp.com',projectId:'bountiful-realtors',appId:'1:853837062187:web:95f51a16304eb1f0c14a6e'};
// ================================================================================================
const SETUP=FB.apiKey.startsWith('PASTE');
if(!SETUP)firebase.initializeApp(FB);
const au=SETUP?null:firebase.auth(),db=SETUP?null:firebase.firestore();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(+n||0).toLocaleString('en-US');
const A=s=>s.docs.map(d=>({id:d.id,...d.data()}));
const G=['#0284c7,#7dd3fc','#38bdf8,#0369a1','#0ea5e9,#1e3a5f','#7dd3fc,#0284c7','#0369a1,#38bdf8','#1e3a5f,#0ea5e9'];
let P=null,L=[],S=[],N=[],view='home',tab='list',mode='up',busy=false;
const ref=(new URLSearchParams(location.search).get('ref')||'').toUpperCase();
const getT=()=>{try{return localStorage.getItem('bp_theme')||'auto'}catch(e){return'auto'}};
function applyTheme(t){const r=document.documentElement;t==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',t)}
function setT(v){try{localStorage.setItem('bp_theme',v)}catch(e){}applyTheme(v)}
const dt=()=>new Date(P.created).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
const note=()=>SETUP?'<div class="card" style="border-color:#b3261e"><b>Setup needed.</b> Paste your Firebase config at the top of this file (see README).</div>':'';
async function loadL(){try{L=A(await db.collection('listings').where('status','==','active').get()).sort((a,b)=>a.created-b.created)}catch(e){L=[]}}
async function load(){
 const u=au.currentUser;if(!u)return;
 const p=await db.collection('profiles').doc(u.uid).get();P=p.exists?{id:p.id,...p.data()}:null;
 await loadL();if(!P)return;
 const [a,b,c]=await Promise.all([db.collection('sales').where('realtor_id','==',u.uid).get(),db.collection('sales').where('upline_id','==',u.uid).get(),db.collection('profiles').where('upline_id','==',u.uid).get()]);
 const m={};[...A(a),...A(b)].forEach(x=>m[x.id]=x);S=Object.values(m).sort((x,y)=>y.created-x.created);N=A(c)}
function msg(m,ok){const x=$('#msg');if(x){x.textContent=m;x.style.color=ok?'#0a7a3d':'#b3261e'}}
async function auth(kind){
 if(SETUP)return msg('Add your Firebase config first (see README).');
 const e=$('#e').value.trim(),pw=$('#pw').value;busy=true;
 try{
  if(kind==='up'){
   const n=$('#n').value.trim(),co=$('#co').value.trim(),rc=$('#rc').value.trim().toUpperCase();
   if(!n||!e||!co||pw.length<6){busy=false;return msg('Fill every field. Password needs at least 6 characters.')}
   let up=null;if(rc){const c=await db.collection('codes').doc(rc).get();if(!c.exists){busy=false;return msg('That referral code was not found.')}up=c.data()}
   const uid=(await au.createUserWithEmailAndPassword(e,pw)).user.uid;
   let code='';for(let i=0;i<8&&!code;i++){const t=(n.replace(/[^A-Za-z]/g,'').slice(0,4)||'BPR').toUpperCase().padEnd(4,'X')+Math.floor(1000+Math.random()*9000);try{await db.collection('codes').doc(t).set({uid,name:n});code=t}catch(x){}}
   if(!code)throw new Error('Could not create a referral code. Please try again.');
   await db.collection('profiles').doc(uid).set({full_name:n,email:e,country:co,referral_code:code,agreement_no:'BP-'+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*1296).toString(36).toUpperCase().padStart(2,'0'),upline_id:up?up.uid:null,upline_name:up?up.name:null,created:Date.now()});
  }else{if(!e||!pw){busy=false;return msg('Enter your email and password.')}await au.signInWithEmailAndPassword(e,pw)}
  await load();busy=false;if(!P)return msg('Signed in, but no profile was found for this account.');
  view='dash';tab=kind==='up'?'agr':'list';render();scrollTo(0,0)
 }catch(x){busy=false;msg(x.message)}}
async function out(){await au.signOut();P=null;S=[];N=[];view='home';render()}
function go(v,m){view=v;if(m)mode=m;render();scrollTo(0,0)}
function nv(t){tab=t;view='dash';render();scrollTo(0,0)}
function drawer(o){$('#sb').classList.toggle('open',!!o);$('#ov').classList.toggle('open',!!o)}
function dd(){const m=$('#ddm');m.hidden=!m.hidden}
function nav(){return `<nav class="nopr">${P?'<button class="ib" onclick="drawer(1)" aria-label="Menu">☰</button>':''}<div class="logo"><i>B</i>Bountiful Properties</div>${P?`<div class="dd"><button class="av" onclick="dd()" aria-label="Account">${esc(P.full_name[0].toUpperCase())}</button><div id="ddm" class="ddm" hidden><a onclick="nv('prof')">👤 My profile</a><a onclick="nv('set')">⚙️ Settings</a><a onclick="out()">🚪 Sign out</a></div></div>`:'<button class="btn alt sm" onclick="go(\'join\',\'in\')">Log in</button>'}</nav>${P?side():''}`}
function side(){const m=[['list','🏠','Listings'],['earn','💰','Earnings'],['net','👥','My network'],['agr','📄','Agreement'],['prof','👤','Profile'],['set','⚙️','Settings']];
 return `<div id="ov" class="ov nopr" onclick="drawer(0)"></div><aside id="sb" class="sb nopr"><div class="sbh"><div class="av big">${esc(P.full_name[0].toUpperCase())}</div><b>${esc(P.full_name)}</b><span class="mut">${esc(P.agreement_no)}</span></div>${m.map(x=>`<a class="${tab===x[0]?'on':''}" onclick="nv('${x[0]}')">${x[1]} ${x[2]}</a>`).join('')}<a onclick="out()">🚪 Sign out</a></aside>`}
function card(p,i,btn){const g=G[i%6].split(',');return `<div class="card" style="margin:0"><div class="ph" style="background:linear-gradient(135deg,${g[0]},${g[1]})">${esc(p.location)}</div><b class="serif">${esc(p.title)}</b><div class="mut">${esc(p.description)}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span class="tag">${esc(p.kind)}</span><b>${money(p.price)}</b></div><div class="mut" style="margin:6px 0">You earn ${money(p.price*.06)}</div>${btn?`<button class="btn sm" onclick="closing('${p.id}')">Submit closing</button>`:''}</div>`}
function grid(btn){return L.length?`<div class="grid">${L.map((p,i)=>card(p,i,btn)).join('')}</div>`:'<p class="mut">No listings yet. Bountiful will post properties here.</p>'}
function calc(){const p=+$('#cp').value||0;$('#cr').innerHTML=`<div class="row"><span>You (6%)</span><b>${money(p*.06)}</b></div><div class="row"><span>Your upline (1%)</span><b>${money(p*.01)}</b></div><div class="row"><span>Agency (3%)</span><b>${money(p*.03)}</b></div><div class="row"><span>You, if your invitee sells (1%)</span><b>${money(p*.01)}</b></div>`}
async function closing(id){const p=L.find(x=>x.id===id);if(!confirm('Submit a closing for '+p.title+'? Bountiful verifies it before commission is paid.'))return;
 try{await db.collection('sales').add({listing_id:id,listing_title:p.title,realtor_id:P.id,realtor_name:P.full_name,realtor_email:P.email,upline_id:P.upline_id||null,upline_name:P.upline_name||null,sale_price:p.price,status:'pending',created:Date.now()})}catch(e){return alert(e.message)}
 await load();tab='earn';render();scrollTo(0,0)}
function render(){const a=$('#app');
 if(view==='home'){a.innerHTML=nav()+note()+`<div class="hero"><h1>Sell Bountiful homes.<br>Earn 6% at closing.</h1><p>Join our global network of realtors. Sell listed properties, ongoing builds and land, and build a team that pays you back.</p><button class="btn" onclick="go('join','up')">Become a realtor</button> <button class="btn" style="background:transparent;border:1.5px solid #fff;color:#fff" onclick="go('join','in')">Log in</button></div>
 <div class="card"><h3 style="margin:0 0 4px">How every closing is shared</h3><p class="mut" style="margin:0">Of each sale price, a 10% commission pool is paid out:</p><div class="split"><div class="s6">6% You</div><div class="s1">1%</div><div class="s3">3% Agency</div></div><div class="key"><span>🟦 6% to the realtor who sells</span><span>🔹 1% to their upline</span><span>⬛ 3% to the agency</span></div></div>
 <div class="card"><h3 style="margin:0 0 10px">Try the calculator</h3><label>Sale price (USD)</label><input id="cp" type="number" value="250000" oninput="calc()"><div id="cr"></div></div><h3 class="serif">Live inventory</h3>${grid(0)}`;calc()}
 if(view==='join')a.innerHTML=nav()+note()+`<div class="card"><h2 style="margin-top:0">${mode==='up'?'Join the network':'Welcome back'}</h2>${mode==='up'?`${ref?`<p class="mut">Invited with referral code <b>${esc(ref)}</b></p>`:''}<label>Full name</label><input id="n" autocomplete="name"><label>Country</label><input id="co"><label>Referral code (optional)</label><input id="rc" value="${esc(ref)}">`:''}<label>Email</label><input id="e" type="email" autocomplete="email"><label>Password</label><input id="pw" type="password" autocomplete="${mode==='up'?'new-password':'current-password'}"><p id="msg" style="font-size:14px;min-height:20px"></p><button class="btn" onclick="auth('${mode}')">${mode==='up'?'Create account':'Log in'}</button> <button class="btn alt" onclick="go('join','${mode==='up'?'in':'up'}')">${mode==='up'?'I have an account':'Create account'}</button> <button class="btn alt" onclick="go('home')">Back</button></div>`;
 if(view==='dash')dash()}
function dash(){
 const my=S.filter(x=>x.realtor_id===P.id||x.upline_id===P.id).map(x=>({...x,own:x.realtor_id===P.id,amt:x.realtor_id===P.id?x.realtor_amt:x.upline_amt}));
 const ok=my.filter(x=>x.status==='confirmed'||x.status==='paid'),earned=ok.reduce((s,x)=>s+(+x.amt||0),0),paid=my.filter(x=>x.status==='paid').reduce((s,x)=>s+(+x.amt||0),0),pend=my.filter(x=>x.status==='pending').length;
 const link=location.origin+location.pathname+'?ref='+P.referral_code;let body='';
 if(tab==='list')body=grid(1);
 if(tab==='earn')body=`<div class="card"><h3 style="margin-top:0">Ledger</h3>${my.length?my.map(x=>`<div class="row"><span>${esc(x.listing_title)}<br><span class="mut">${x.own?'Own sale · 6%':'Team sale ('+esc(x.realtor_name||'invitee')+') · 1%'} · ${x.status}</span></span><b style="color:var(--gold)">${x.status==='pending'?'Pending':x.status==='rejected'?'Rejected':'+'+money(x.amt)}</b></div>`).join(''):'<p class="mut">No closings yet. Submit one from Listings after a sale.</p>'}</div>`;
 if(tab==='net')body=`<div class="card"><h3 style="margin-top:0">Your referral link</h3><div class="link">${esc(link)}</div><br><button class="btn sm" onclick="navigator.clipboard&&navigator.clipboard.writeText('${link}').then(()=>this.textContent='Copied ✓')">Copy link</button><p class="mut">Each time someone you invite sells a property, you earn 1% of the sale price. Your code: <b>${esc(P.referral_code)}</b></p></div><div class="card"><h3 style="margin-top:0">Your team (${N.length})</h3>${N.length?N.map(x=>`<div class="row"><span>${esc(x.full_name)}</span><span class="mut">${esc(x.country||'')}</span></div>`).join(''):'<p class="mut">Nobody has joined through your link yet.</p>'}<div class="row"><span>Your upline</span><b>${esc(P.upline_name||'Bountiful Properties')}</b></div></div>`;
 if(tab==='agr')body=`<div class="card"><h3 style="margin-top:0">Commission agreement</h3><div class="row"><span>Agreement No.</span><b>${esc(P.agreement_no)}</b></div><div class="row"><span>Realtor</span><b>${esc(P.full_name)}</b></div><div class="row"><span>Upline</span><b>${esc(P.upline_name||'Bountiful Properties (direct)')}</b></div><div class="row"><span>Your rates</span><b>6% own sales · 1% team sales</b></div><div class="row"><span>Date</span><b>${dt()}</b></div><br><button class="btn" onclick="pdf()">Download agreement PDF</button></div>`;
 if(tab==='prof')body=`<div class="card"><h3 style="margin-top:0">My profile</h3><label>Full name</label><input id="pn" value="${esc(P.full_name)}"><label>Email</label><input value="${esc(P.email)}" disabled><label>Country</label><input id="pc" value="${esc(P.country)}"><br><br><button class="btn" onclick="saveP()">Save changes</button></div>`;
 if(tab==='set')body=`<div class="card"><h3 style="margin-top:0">Settings</h3><label>Appearance</label><select onchange="setT(this.value)">${['auto','light','dark'].map(v=>`<option value="${v}" ${getT()===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select><br><br><button class="btn alt" onclick="out()">Sign out</button></div>`;
 $('#app').innerHTML=nav()+`<h2 style="margin:0">Welcome, ${esc(P.full_name.split(' ')[0])}</h2><p class="mut nopr" style="margin:2px 0 12px">${esc(P.agreement_no)} · ${esc(P.country||'')}</p><div class="stats nopr"><div class="stat"><b>${money(earned)}</b><span>Earned</span></div><div class="stat"><b>${money(paid)}</b><span>Paid out</span></div><div class="stat"><b>${pend}</b><span>Pending</span></div></div><div class="tabs nopr">${[['list','Listings'],['earn','Earnings'],['net','Network'],['agr','Agreement']].map(t=>`<button class="${tab===t[0]?'on':''}" onclick="nv('${t[0]}')">${t[1]}</button>`).join('')}</div>${body}`}
async function saveP(){const n=$('#pn').value.trim(),c=$('#pc').value.trim();if(!n||!c)return;try{await db.collection('profiles').doc(P.id).update({full_name:n,country:c})}catch(e){return alert(e.message)}await load();render()}
function pdf(){const {jsPDF}=window.jspdf,d=new jsPDF({unit:'pt',format:'a4'});let y=110;
 d.setFillColor(3,105,161);d.rect(0,0,595,70,'F');d.setTextColor(255);d.setFont('times','bold');d.setFontSize(20);d.text('BOUNTIFUL PROPERTIES',50,43);d.setTextColor(20);
 const T=(t,s,b)=>{d.setFont('times',b?'bold':'normal');d.setFontSize(s);const l=d.splitTextToSize(t,495);d.text(l,50,y);y+=l.length*s*1.35+8};
 T('REALTOR COMMISSION AGREEMENT',16,1);T('Agreement No. '+P.agreement_no+'   |   Date: '+dt(),10);y+=6;
 T('This agreement is made between Bountiful Properties (“the Agency”) and '+P.full_name+' of '+(P.country||'')+', '+P.email+' (“the Realtor”).',11);y+=4;
 T('Realtor: '+P.full_name+' (Code '+P.referral_code+')',11,1);T('Upline: '+(P.upline_name||'None (direct to Bountiful Properties)'),11,1);T('Agency: Bountiful Properties',11,1);y+=6;
 ['1. Scope. The Realtor may market and sell properties, ongoing developments and land listed or built by Bountiful Properties, in any country.',
 '2. Commission. On each closed sale, a commission pool of 10% of the sale price is shared as follows: 6% to the selling Realtor, 1% to the upline of the selling Realtor, and 3% to Bountiful Properties.',
 '3. Referrals. The Realtor may invite others through a personal referral link. When an invited Realtor closes a sale, the Realtor earns 1% of that sale price. Where a Realtor has no upline, the 1% upline share is retained by the Agency.',
 '4. Payment. Commission is earned upon closing, meaning full payment received and title or allocation confirmed by Bountiful Properties, and is payable after that confirmation.',

function home(){return topbar()+`<main><div class="hero"><span class="lw">${logo(52)}</span><h1>Sell premium properties.<br>Earn 6% at closing.</h1><p>BPR connects realtors worldwide to Bountiful Properties’ listings, ongoing builds and land. Earn commission on every sale and build a team that pays you back.</p><div class="ha"><button class="btn" onclick="go('join','up')">Become a realtor</button><button class="btn o" onclick="go('join','in')">Log in</button></div></div>
<div class="grid" style="margin-bottom:14px">${[['globe','Join from anywhere','Sign up free and get your agreement and referral link instantly.'],['building','Sell Bountiful properties','Homes, ongoing builds and land, all with fixed commission.'],['dollar','Earn at closing','6% on your sales, plus 1% whenever someone you invite sells.']].map(x=>`<div class="card step" style="margin:0"><div class="ic">${ic(x[0])}</div><div><b>${x[1]}</b><div class="mut ts">${x[2]}</div></div></div>`).join('')}</div>

function joinV(){const up=mode==='up';return topbar()+`<main><div class="card" style="max-width:460px;margin:10px auto"><div style="text-align:center;margin-bottom:6px">${logo(56)}</div><h2 style="text-align:center">${up?'Join BPR':'Welcome back'}</h2><div class="mut ts" style="text-align:center">${up?'Create your realtor account in a minute.':'Log in to your realtor account.'}</div>${up?`${ref?`<p class="ts" style="text-align:center">Invited with code <b>${esc(ref)}</b></p>`:''}<label>Full name</label><input id="n" autocomplete="name"><label>Country</label><input id="co"><label>Referral code (optional)</label><input id="rc" value="${esc(ref)}">`:''}<label>Email</label><input id="e" type="email" autocomplete="email"><label>Password</label><div style="position:relative"><input id="pw" type="password" autocomplete="${up?'new-password':'current-password'}" style="padding-right:80px"><button type="button" id="pwb" onclick="tp()" style="position:absolute;right:7px;top:7px;border:0;background:var(--soft);color:var(--pri);font:600 13px inherit;font-family:inherit;padding:7px 12px;border-radius:9px;cursor:pointer">Show</button></div><p id="msg" class="ts" style="min-height:20px;margin:8px 0"></p><button class="btn w" onclick="auth('${mode}')">${up?'Create account':'Log in'}</button>${up?'':`<p class="ts" style="text-align:center;margin:12px 0 0"><a onclick="reset()" style="color:var(--pri);cursor:pointer;font-weight:600">Forgot password?</a></p>`}<p class="ts mut" style="text-align:center;margin:14px 0 0">${up?'Already have an account?':'New to BPR?'} <a onclick="go('join','${up?'in':'up'}')" style="color:var(--pri);cursor:pointer;font-weight:600">${up?'Log in':'Create account'}</a></p></div></main>`}

 if(!adm&&tab.startsWith('a-'))tab='dash';
 const T={dash:['Dashboard','Your performance at a glance'],list:['Properties','Browse and sell Bountiful listings'],earn:['Earnings','Your commission ledger'],net:['My network','Grow your team and earn 1% on their sales'],agr:['Agreement','Your commission agreement'],prof:['Profile','Your account details'],set:['Settings','Appearance and app'],'a-ov':['Admin overview','Platform performance'],'a-cl':['Closings','Review and pay commissions'],'a-lst':['Manage listings','Post and edit properties'],'a-ppl':['Realtors','Everyone on the network']}[tab];
 const body={dash:tDash,list:tList,earn:tEarn,net:tNet,agr:tAgr,prof:tProf,set:tSet,'a-ov':aOv,'a-cl':aCl,'a-lst':aLst,'a-ppl':aPpl}[tab]();
 const li=(k,i,t)=>`<a class="${tab===k?'on':''}" onclick="nv('${k}')">${ic(i)}${t}${k==='a-cl'&&pendN()?`<span class="chip wr" style="margin-left:auto">${pendN()}</span>`:''}</a>`;
 const bn=(k,i,t)=>`<a class="${tab===k?'on':''}" onclick="nv('${k}')">${ic(i)}${t}</a>`;
 return `<div id="ov" class="ov" onclick="drawer(0)"></div><aside id="sb" class="sb"><div class="u"><div class="av" style="cursor:default;${avs()}">${esc(P.full_name[0].toUpperCase())}</div><div><b>${esc(P.full_name)}</b><div class="mut ts">${adm?'Administrator':'Realtor'} · ${esc(P.agreement_no)}</div></div></div><h4>Workspace</h4>${li('dash','home','Dashboard')}${li('list','building','Properties')}${li('earn','wallet','Earnings')}${li('net','users','My network')}${li('agr','file','Agreement')}${adm?`<h4>Administration</h4>${li('a-ov','chart','Overview')}${li('a-cl','dollar','Closings')}${li('a-lst','plus','Manage listings')}${li('a-ppl','users','Realtors')}`:''}<h4>Account</h4>${li('prof','user','Profile')}${li('set','gear','Settings')}<a onclick="out()">${ic('logout')}Sign out</a></aside>${topbar()}<main><div class="ph"><h2>${T[0]}</h2><div class="mut ts">${T[1]}</div></div>${body}</main><nav class="bn">${bn('dash','home','Home')}${bn('list','building','Listings')}${bn('earn','wallet','Earnings')}${bn('net','users','Network')}<a onclick="drawer(1)">${ic('menu')}Menu</a></nav>`}

function tDash(){const m=mine(),ok=m.filter(x=>x.status==='confirmed'||x.status==='paid'),earned=sum(ok,x=>x.amt),paid=sum(m.filter(x=>x.status==='paid'),x=>x.amt),pend=m.filter(x=>x.status==='pending').length;
 return `<div class="kpis"><div class="kpi"><div class="ic">${ic('dollar')}</div><b>${money(earned)}</b><span>Total earned</span></div><div class="kpi"><div class="ic">${ic('check')}</div><b>${money(paid)}</b><span>Paid out</span></div><div class="kpi"><div class="ic">${ic('clock')}</div><b>${pend}</b><span>Pending closings</span></div><div class="kpi"><div class="ic">${ic('users')}</div><b>${N.length}</b><span>Team members</span></div></div>
 ${adm?`<div class="card" style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div><b>Admin console</b><div class="mut ts">${pendN()} closing${pendN()===1?'':'s'} waiting for review</div></div><div style="display:flex;gap:8px"><button class="btn ghost sm" onclick="nv('a-lst')">Post a property</button><button class="btn sm" onclick="nv('a-cl')">Review closings</button></div></div>`:''}
 <div class="card"><h3>Your commission rates</h3>${SPLIT}<div class="mut ts">You earn 6% on your own sales and 1% when someone you invited sells. Bountiful Properties keeps 3%.</div></div>
 <div class="card"><h3>Recent activity</h3>${m.length?m.slice(0,4).map(ledRow).join(''):'<div class="mut">No closings yet. Browse properties and submit a closing after a sale.</div>'}</div>
 <div class="card"><h3>Invite and earn</h3><div class="link">${esc(lnk())}</div><button class="btn sm" style="margin-top:10px" onclick="cp()">${ic('copy')}Copy link</button></div>`}
function tList(){return `<input id="qs" placeholder="Search by name or location" value="${esc(q)}" oninput="q=this.value;drawList()"><div class="chips">${['All','Available','Ongoing build','Land'].map(k=>`<button class="${kf===k?'on':''}" onclick="kf='${k}';render()">${k}</button>`).join('')}</div><div id="lg"></div>`}
function drawList(){const x=L.filter(p=>(kf==='All'||p.kind===kf)&&(p.title+' '+p.location).toLowerCase().includes(q.toLowerCase()));const e=$('#lg');if(e)e.innerHTML=x.length?`<div class="grid">${x.map(p=>pcard(p,1)).join('')}</div>`:'<div class="card mut">No properties found.</div>'}
function tEarn(){const m=mine();return `<div class="card">${m.length?m.map(ledRow).join(''):'<div class="mut">No closings yet. Submit one from Properties after a sale.</div>'}</div>`}
function tNet(){return `<div class="card"><h3>Your referral link</h3><div class="link">${esc(lnk())}</div><button class="btn sm" style="margin:10px 0" onclick="cp()">${ic('copy')}Copy link</button><div class="mut ts">Your code: <b>${esc(P.referral_code)}</b>. Each time someone you invite sells a property, you earn 1% of the sale price.</div></div><div class="card"><h3>Your team (${N.length})</h3>${N.length?N.map(x=>`<div class="row"><b>${esc(x.full_name)}</b><span class="mut ts">${esc(x.country||'')}</span></div>`).join(''):'<div class="mut">Nobody has joined through your link yet.</div>'}<div class="row"><span class="mut">Your upline</span><b>${esc(P.upline_name||'Bountiful Properties')}</b></div></div>`}
function tAgr(){return `<div class="card"><div class="row"><span class="mut">Agreement No.</span><b>${esc(P.agreement_no)}</b></div><div class="row"><span class="mut">Realtor</span><b>${esc(P.full_name)}</b></div><div class="row"><span class="mut">Upline</span><b>${esc(P.upline_name||'Bountiful Properties (direct)')}</b></div><div class="row"><span class="mut">Your rates</span><b>6% own · 1% team</b></div><div class="row"><span class="mut">Date</span><b>${fd(P.created)}</b></div><button class="btn w" style="margin-top:12px" onclick="pdf()">${ic('download')}Download agreement PDF</button></div>`}
function tProf(){return `<div class="card"><div style="display:flex;gap:14px;align-items:center;margin-bottom:6px"><div class="av lg" style="${avs()}">${esc(P.full_name[0].toUpperCase())}</div><div><h3 style="margin:0">${esc(P.full_name)}</h3><div class="mut ts">${esc(P.email)}</div><div style="margin-top:6px"><span class="chip">${adm?'Administrator':'Realtor'}</span></div></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn ghost sm" onclick="$('#pf').click()">${ic('camera')}${P.photo?'Change photo':'Upload photo'}</button>${P.photo?'<button class="btn bad sm" onclick="rmPhoto()">Remove photo</button>':''}<input id="pf" type="file" accept="image/*" hidden onchange="pickPhoto(this)"></div>${adm?`<div class="card" style="margin:12px 0 0;background:var(--soft);box-shadow:none"><b>Admin access</b><div class="mut ts" style="margin-bottom:10px">You have full backend access: post properties, review closings and pay commissions.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="nv('a-lst')">Post a property</button><button class="btn ghost sm" onclick="nv('a-cl')">Closings</button><button class="btn ghost sm" onclick="nv('a-ov')">Overview</button></div></div>`:''}</div>
 ${adm?'':adminHelp()}<div class="card"><h3>Details</h3><label>Full name</label><input id="pn" value="${esc(P.full_name)}"><label>Country</label><input id="pc" value="${esc(P.country)}"><button class="btn" style="margin-top:14px" onclick="saveP()">Save changes</button></div>
 <div class="card"><div class="row"><span class="mut">Realtor ID</span><b>${esc(P.agreement_no)}</b></div><div class="row"><span class="mut">Referral code</span><b>${esc(P.referral_code)}</b></div><div class="row"><span class="mut">Upline</span><b>${esc(P.upline_name||'Bountiful Properties')}</b></div><div class="row"><span class="mut">Joined</span><b>${fd(P.created)}</b></div></div>`}
function tSet(){const inst=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
 return `<div class="card"><h3>Appearance</h3><select onchange="setT(this.value)">${['auto','light','dark'].map(v=>`<option value="${v}" ${getT()===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></div>
 <div class="card"><h3>Install BPR</h3>${inst?'<div class="mut">BPR is installed on this device.</div>':dip?`<button class="btn" onclick="inst()">${ic('phone')}Install app</button>`:'<div class="mut ts">iPhone: tap Share, then Add to Home Screen.<br>Android: open the browser menu and tap Install app.</div>'}</div>
 <div class="card"><h3>Account</h3><button class="btn ghost w" onclick="resetMe()">Send password reset email</button><button class="btn bad w" style="margin-top:10px" onclick="out()">${ic('logout')}Sign out</button></div>`}

 try{await db.collection('sales').add({listing_id:id,listing_title:p.title,realtor_id:P.id,realtor_name:P.full_name,realtor_email:P.email,upline_id:P.upline_id||null,upline_name:P.upline_name||null,sale_price:p.price,status:'pending',created:Date.now()})}catch(e){return toast(e.message)}

function adminHelp(){return `<div class="card" style="background:var(--soft);box-shadow:none"><b>Admin access</b><div class="mut ts" style="margin:4px 0 10px">This account is not an admin yet. To make it one, open Firebase, go to Firestore Database, and add a document in the collection <b>admins</b> whose Document ID is exactly this:</div><div class="link">${esc(P.id)}</div><button class="btn sm" style="margin-top:10px" onclick="cpId()">${ic('copy')}Copy my ID</button>${admErr?`<div class="ts" style="color:var(--bad);margin-top:10px">Admin check error: ${esc(admErr)}</div>`:''}</div>`}
function pickPhoto(inp){const f=inp.files&&inp.files[0];if(!f)return;const img=new Image(),rd=new FileReader();
 rd.onload=()=>{img.onload=async()=>{const c=document.createElement('canvas'),z=256;c.width=c.height=z;const x=c.getContext('2d'),m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,z,z);
  let q=.85,d=c.toDataURL('image/jpeg',q);while(d.length>60000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}
  try{await db.collection('profiles').doc(P.id).update({photo:d});P.photo=d;render();toast('Profile photo updated')}catch(e){toast(e.message)}};img.onerror=()=>toast('Could not read that image');img.src=rd.result};
 rd.readAsDataURL(f)}

function saleCard(x){const done=x.status==='confirmed'||x.status==='paid';
 return `<div class="card"><div class="row" style="padding-top:0"><b>${esc(x.listing_title)}</b>${st(x.status)}</div><div class="mut ts">${esc(x.realtor_name)} · ${esc(x.realtor_email)}<br>Upline: ${esc(x.upline_name||'none')} · ${fd(x.created)}</div><div class="row"><span>Sale price</span><b>${money(x.sale_price)}</b></div>${done?`<div class="row"><span>Realtor 6%</span><b>${money(x.realtor_amt)}</b></div><div class="row"><span>Upline 1%</span><b>${money(x.upline_amt)}</b></div><div class="row"><span>Agency</span><b>${money(x.agency_amt)}</b></div>`:''}${x.status==='pending'?`<div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm" onclick="act('${x.id}','confirmed')">Confirm closing</button><button class="btn bad sm" onclick="act('${x.id}','rejected')">Reject</button></div>`:''}${x.status==='confirmed'?`<button class="btn sm" style="margin-top:8px" onclick="act('${x.id}','paid')">Mark commissions paid</button>`:''}</div>`}
function aOv(){const s=AD.sales,ok=s.filter(x=>x.status==='confirmed'||x.status==='paid'),owed=s.filter(x=>x.status==='confirmed'),pd=s.filter(x=>x.status==='paid'),pend=s.filter(x=>x.status==='pending');

 return `<div class="kpis"><div class="kpi"><div class="ic">${ic('users')}</div><b>${AD.people.length}</b><span>Realtors</span></div><div class="kpi"><div class="ic">${ic('clock')}</div><b>${pend.length}</b><span>Pending closings</span></div><div class="kpi"><div class="ic">${ic('chart')}</div><b>${money(sum(ok,x=>x.sale_price))}</b><span>Sales volume</span></div><div class="kpi"><div class="ic">${ic('building')}</div><b>${AD.listings.filter(x=>x.status==='active').length}</b><span>Active listings</span></div></div>
 <div class="card"><h3>Commission distribution</h3>${bar}<div class="row"><span>Realtors (6%)</span><b>${money(tr)}</b></div><div class="row"><span>Uplines (1%)</span><b>${money(tu)}</b></div><div class="row"><span>Agency</span><b>${money(ta)}</b></div><div class="row"><span>Owed to realtors</span><b>${money(sum(owed,x=>+x.realtor_amt+ +x.upline_amt))}</b></div><div class="row"><span>Paid out</span><b>${money(sum(pd,x=>+x.realtor_amt+ +x.upline_amt))}</b></div></div>
 <h3 style="margin:16px 0 10px">Waiting for review</h3>${pend.map(saleCard).join('')||'<div class="card mut">Nothing waiting.</div>'}`}
function aCl(){const s=AD.sales.filter(x=>cf==='All'||x.status===cf.toLowerCase());
 return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div class="chips" style="margin:0;padding:0 0 10px;flex:1">${['All','Pending','Confirmed','Paid','Rejected'].map(k=>`<button class="${cf===k?'on':''}" onclick="cf='${k}';render()">${k}</button>`).join('')}</div><button class="btn ghost sm" onclick="csv()" style="margin-bottom:10px">${ic('download')}CSV</button></div>${s.map(saleCard).join('')||'<div class="card mut">No closings in this view.</div>'}`}

const lst=s=>`<span class="chip ${s==='active'?'ok':s==='sold'?'wr':'bd'}">${s}</span>`;
function aLst(){return `<div class="card"><h3>Post a property</h3><label>Title</label><input id="lt" placeholder="e.g. Palm Crest Terraces"><label>Location</label><input id="ll" placeholder="e.g. Lekki, Lagos"><label>Type</label><select id="lk"><option>Available</option><option>Ongoing build</option><option>Land</option></select><label>Price (USD)</label><input id="lp" type="number" inputmode="decimal"><label>Description</label><input id="ld" placeholder="e.g. 4-bed duplexes"><label>Photos (up to 3)</label><button class="btn ghost sm" type="button" onclick="$('#lf').click()">${ic('camera')}Add photos</button><input id="lf" type="file" accept="image/*" multiple hidden onchange="addPh(this)"><div id="pp" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn" onclick="addL()">${ic('plus')}Post property</button>${AD.listings.length?'':'<button class="btn ghost" onclick="seed()">Load 6 sample listings</button>'}</div></div>
 <h3 style="margin:16px 0 10px">All listings (${AD.listings.length})</h3><input id="ef" type="file" accept="image/*" multiple hidden onchange="addPhTo(this)">${AD.listings.map(p=>`<div class="card"><div class="row" style="padding-top:0"><b>${esc(p.title)}</b>${lst(p.status)}</div><div class="mut ts">${esc(p.location)} · ${esc(p.kind)} · ${money(p.price)}</div>${(p.photos||[]).length?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">${p.photos.map((u,i)=>`<div style="position:relative"><img src="${u}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:10px"><button onclick="rmPh('${p.id}',${i})" aria-label="Remove photo" style="${XB}">✕</button></div>`).join('')}</div>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn ghost sm" onclick="editId='${p.id}';$('#ef').click()">${ic('camera')}Photos</button><button class="btn ghost sm" onclick="priceL('${p.id}')">Edit price</button>${p.status!=='active'?`<button class="btn ghost sm" onclick="setL('${p.id}','active')">Activate</button>`:`<button class="btn ghost sm" onclick="setL('${p.id}','sold')">Mark sold</button>`}${p.status!=='archived'?`<button class="btn ghost sm" onclick="setL('${p.id}','archived')">Archive</button>`:''}<button class="btn bad sm" onclick="delL('${p.id}')">Delete</button></div></div>`).join('')}`}
function aPpl(){return `<div class="card">${AD.people.map(x=>`<div class="row"><div><b>${esc(x.full_name)}</b><div class="mut ts">${esc(x.email)} · ${esc(x.country||'')}<br>Code ${esc(x.referral_code)} · Upline: ${esc(x.upline_name||'none')}</div></div><span class="mut ts">${fd(x.created)}</span></div>`).join('')||'<div class="mut">No realtors yet.</div>'}</div>`}
async function act(id,s){let u={status:s};
 if(s==='confirmed'){const x=AD.sales.find(y=>y.id===id),v=prompt('Final sale price (USD)',x.sale_price);if(v===null)return;const p=+v;if(!(p>0))return toast('Enter a valid price');const up=!!x.upline_id;
  u={status:'confirmed',sale_price:p,realtor_amt:r2(p*.06),upline_amt:up?r2(p*.01):0,agency_amt:r2(p*.03+(up?0:p*.01)),confirmed_at:Date.now()}}
 else if(s==='paid'){if(!confirm('Mark these commissions as paid?'))return;u={status:'paid',paid_at:Date.now()}}
 else if(!confirm('Reject this closing?'))return;
 try{await db.collection('sales').doc(id).update(u)}catch(e){return toast(e.message)}await loadAD();render();toast('Closing '+s)}
async function addL(){const r={title:$('#lt').value.trim(),location:$('#ll').value.trim(),kind:$('#lk').value,price:+$('#lp').value,description:$('#ld').value.trim(),photos:newPh.slice(),status:'active',created:Date.now()};
 if(!r.title||!r.location||!(r.price>0))return toast('Title, location and price are required');
 try{await db.collection('listings').add(r)}catch(e){return toast(e.message)}newPh=[];await loadAD();await loadL();render();toast('Property posted')}
async function seed(){const s=[['Palm Crest Terraces','Lekki, Lagos','Ongoing build','4-bed duplexes',185000],['Heritage Land Estate','Abuja, Nigeria','Land','600 sqm plots, C of O',42000],['Azure Bay Apartments','Accra, Ghana','Available','2-bed sea view',128000],['Golden Ridge Villas','Dubai, UAE','Ongoing build','5-bed gated villas',420000],['Savannah Gardens','Nairobi, Kenya','Available','3-bed townhouses',96000],['Kingsway Mews','London, UK','Available','Prime flats',560000]];
 try{for(let i=0;i<s.length;i++)await db.collection('listings').add({title:s[i][0],location:s[i][1],kind:s[i][2],description:s[i][3],price:s[i][4],status:'active',created:Date.now()+i})}catch(e){return toast(e.message)}await loadAD();await loadL();render();toast('Sample listings added')}
async function setL(id,s){try{await db.collection('listings').doc(id).update({status:s})}catch(e){return toast(e.message)}await loadAD();await loadL();render()}
async function priceL(id){const v=+prompt('New price (USD)');if(!(v>0))return;try{await db.collection('listings').doc(id).update({price:v})}catch(e){return toast(e.message)}await loadAD();await loadL();render()}
function csv(){const rows=[['Closing','Property','Realtor','Email','Upline','Sale price','Realtor 6%','Upline 1%','Agency','Status']].concat(AD.sales.map(x=>[x.id,x.listing_title,x.realtor_name,x.realtor_email,x.upline_name||'',x.sale_price,x.realtor_amt??'',x.upline_amt??'',x.agency_amt??'',x.status]));
 const t=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='bpr-closings.csv';a.click()}
function shrink(file,max=900,cap=110000){return new Promise((res,rej)=>{const rd=new FileReader(),img=new Image();rd.onload=()=>{img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=.8,d=c.toDataURL('image/jpeg',q);while(d.length>cap&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}res(d)};img.onerror=()=>rej(new Error('Could not read that image'));img.src=rd.result};rd.onerror=()=>rej(new Error('Could not read that file'));rd.readAsDataURL(file)})}
async function addPh(inp){const fs=[...inp.files].slice(0,3-newPh.length);if(!fs.length){inp.value='';return toast('Maximum 3 photos per property')}try{for(const f of fs)newPh.push(await shrink(f))}catch(e){toast(e.message)}inp.value='';drawPp()}
function drawPp(){const e=$('#pp');if(e)e.innerHTML=newPh.map((u,i)=>`<div style="position:relative"><img src="${u}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:10px"><button onclick="newPh.splice(${i},1);drawPp()" aria-label="Remove photo" style="${XB}">✕</button></div>`).join('')}
async function addPhTo(inp){const p=AD.listings.find(x=>x.id===editId);if(!p){inp.value='';return}const cur=p.photos||[],fs=[...inp.files].slice(0,3-cur.length);if(!fs.length){inp.value='';return toast('Maximum 3 photos per property')}
 try{const add=[];for(const f of fs)add.push(await shrink(f));await db.collection('listings').doc(editId).update({photos:[...cur,...add]});toast('Photos added')}catch(e){toast(e.message)}inp.value='';await loadAD();await loadL();render()}
async function rmPh(id,i){const p=AD.listings.find(x=>x.id===id);try{await db.collection('listings').doc(id).update({photos:(p.photos||[]).filter((_,k)=>k!==i)})}catch(e){return toast(e.message)}await loadAD();await loadL();render()}
async function delL(id){const p=AD.listings.find(x=>x.id===id);if(!confirm('Delete "'+p.title+'" permanently? Closings already recorded for it are kept.'))return;try{await db.collection('listings').doc(id).delete()}catch(e){return toast(e.message)}await loadAD();await loadL();render();toast('Listing deleted')}
function gal(id){const p=L.find(x=>x.id===id)||AD.listings.find(x=>x.id===id);if(!p||!(p.photos||[]).length)return;const d=document.createElement('div');d.id='gal';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:flex;flex-direction:column';
 d.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 8px;color:#fff"><b>${esc(p.title)}</b><button class="ib" onclick="this.closest('#gal').remove()" aria-label="Close" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)">✕</button></div><div style="flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;align-items:center">${p.photos.map(u=>`<img src="${u}" alt="" style="flex:none;width:100%;max-height:100%;object-fit:contain;scroll-snap-align:center">`).join('')}</div>`;document.body.appendChild(d)}

 const c=document.createElement('canvas'),x=c.getContext('2d'),f='600 56px "Dancing Script","Snell Roundhand","Segoe Script","Brush Script MT",cursive';x.font=f;const w=Math.ceil(x.measureText(n).width)+24,h=90;c.width=w;c.height=h;x.font=f;x.fillStyle='#0b2a5b';x.textBaseline='middle';x.fillText(n,12,h/2+4);

 T('REALTOR COMMISSION AGREEMENT',16,1);T('Agreement No. '+P.agreement_no+'   |   Date: '+fd(P.created),10);y+=6;
 T('This agreement is made between Bountiful Properties (“the Agency”) and '+P.full_name+' of '+(P.country||'')+', '+P.email+' (“the Realtor”).',11);y+=4;
 T('Realtor: '+P.full_name+' (Code '+P.referral_code+')',11,1);T('Upline: '+(P.upline_name||'None (direct to Bountiful Properties)'),11,1);T('Agency: Bountiful Properties',11,1);y+=6;
 ['1. Scope. The Realtor may market and sell properties, ongoing developments and land listed or built by Bountiful Properties, in any country.',
 '2. Commission. On each closed sale, a commission pool of 10% of the sale price is shared as follows: 6% to the selling Realtor, 1% to the upline of the selling Realtor, and 3% to Bountiful Properties.',
 '3. Referrals. The Realtor may invite others through a personal referral link. When an invited Realtor closes a sale, the Realtor earns 1% of that sale price. Where a Realtor has no upline, the 1% upline share is retained by the Agency.',
 '4. Payment. Commission is earned upon closing, meaning full payment received and title or allocation confirmed by Bountiful Properties, and is payable after that confirmation.',
 '5. Conduct. The Realtor shall represent properties truthfully, quote only prices set by Bountiful Properties, and shall not receive client funds directly.',

function shrink(file,max=900,cap=110000){return new Promise((res,rej)=>{const rd=new FileReader(),img=new Image();rd.onload=()=>{img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=.8,d=c.toDataURL('image/jpeg',q);while(d.length>cap&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}res(d)};img.onerror=()=>rej(new Error('Could not read that image'));img.src=rd.result};rd.onerror=()=>rej(new Error('Could not read that file'));rd.readAsDataURL(file)})}

async function savePay(){if(!au.currentUser.emailVerified)return toast('Please verify your email first (see the banner on your dashboard).');const b=$('#pb').value.trim(),n=$('#pan').value.trim(),a=$('#pac').value.trim();if(!b||!n||!a)return toast('Fill in all three payout fields');if(!/^[A-Za-z0-9 \-]{6,34}$/.test(a))return toast('Enter a valid account number');
 const o={bank:b,account_name:n,account_number:a,updated:Date.now()};try{await db.collection('payouts').doc(P.id).set(o)}catch(e){return toast(e.message)}PAYO=o;render();toast('Payout details saved')}
function payRow(uid,name,amt,c,label){const o=AD.pay[uid];return `<div class="row" style="align-items:flex-start"><div><b>${label}: ${esc(name||'')}</b><div class="mut ts">${o?esc(o.bank)+' · '+esc(o.account_name)+' · '+esc(o.account_number):'No payout details added yet'}</div></div><b>${money(amt,c)}</b></div>`}
function payTo(x){const c=cu(x);return `<div style="margin-top:8px"><div class="mut ts" style="font-weight:700">Pay to</div>${payRow(x.realtor_id,x.realtor_name,x.realtor_amt,c,'Realtor')}${x.upline_id?payRow(x.upline_id,x.upline_name,x.upline_amt,c,'Upline'):''}</div>`}
async function mkAdmin(id){const x=AD.people.find(y=>y.id===id);if(!x||!confirm('Make '+x.full_name+' an admin? Admins can post listings, confirm closings, see payout details and add or remove other admins.'))return;try{await db.collection('admins').doc(id).set({role:'admin',added_by:P.id,created:Date.now()})}catch(e){return toast(e.message)}await loadAD();render();toast(x.full_name+' is now an admin')}
async function rmAdmin(id){const x=AD.people.find(y=>y.id===id);if(!x||!confirm('Remove admin access for '+x.full_name+'?'))return;try{await db.collection('admins').doc(id).delete()}catch(e){return toast(e.message)}await loadAD();render();toast('Admin access removed')}
function vb(){const u=au.currentUser;if(!u||u.emailVerified)return '';return `<div class="card" style="background:var(--soft);box-shadow:none"><b>Verify your email</b><div class="mut ts" style="margin:4px 0 10px">We sent a link to ${esc(u.email)}. Verify it to submit closings and save payout details.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="checkV()">I have verified</button><button class="btn ghost sm" onclick="resendV()">Resend email</button></div></div>`}
async function resendV(){try{await au.currentUser.sendEmailVerification();toast('Verification email sent')}catch(e){toast(e.message)}}
async function checkV(){try{await au.currentUser.reload();await au.currentUser.getIdToken(true)}catch(e){return toast(e.message)}render();toast(au.currentUser.emailVerified?'Email verified':'Not verified yet. Check your inbox and spam folder.')}
function agrCard(){const np=AD.people.filter(x=>!AD.ag[x.id]);return `<div class="card"><h3>Agreement countersignatures</h3><div class="mut ts" style="margin-bottom:10px">${np.length} agreement${np.length===1?'':'s'} waiting for your countersignature.${AD.sigDoc?'':' Upload your signature in Settings first.'}</div>${np.length&&AD.sigDoc?`<button class="btn sm" onclick="countersignAll()">Countersign all</button>`:''}</div>`}
function sigCard(){const s=AD.sigDoc;return `<div class="card"><h3>Admin signature</h3><div class="mut ts" style="margin-bottom:10px">Used to countersign agreements. It is stored privately and only copied into an agreement when you countersign it.</div>${s?`<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;margin-bottom:10px"><img src="${s.png}" alt="Signature" style="max-height:80px;max-width:100%"></div>`:''}<label>Signatory name</label><input id="sgn" value="${esc(s?s.name:'Bosun')}"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn sm" onclick="$('#sgf').click()">${ic('camera')}${s?'Replace signature image':'Upload signature image'}</button>${s?`<button class="btn ghost sm" onclick="saveSigName()">Save name</button>`:''}</div><input id="sgf" type="file" accept="image/png" hidden onchange="pickSig(this)"><div class="mut ts" style="margin-top:8px">Use a PNG with a transparent background.</div></div>`}
function pickSig(inp){const f=inp.files&&inp.files[0];if(!f)return;const name=$('#sgn').value.trim();if(!name){inp.value='';return toast('Enter the signatory name first')}
 const rd=new FileReader(),img=new Image();rd.onload=()=>{img.onload=async()=>{let png='',w=0,h=0;for(const t of [400,300,220]){w=Math.min(t,img.width);h=Math.round(img.height*w/img.width);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);png=c.toDataURL('image/png');if(png.length<150000)break}
  if(png.length>=190000)return toast('That image is too detailed. Use a smaller PNG.');
  try{await db.collection('settings').doc('signature').set({name,png,sw:w,sh:h,updated:Date.now()});await loadAD();render();toast('Signature saved')}catch(e){toast(e.message)}};img.onerror=()=>toast('Could not read that image');img.src=rd.result};rd.readAsDataURL(f);inp.value=''}
async function saveSigName(){const name=$('#sgn').value.trim();if(!name)return toast('Enter the signatory name');try{await db.collection('settings').doc('signature').update({name,updated:Date.now()});await loadAD();render();toast('Name saved')}catch(e){toast(e.message)}}
async function countersign(id,quiet){const s=AD.sigDoc;if(!s)return toast('Upload your signature in Settings first');const x=AD.people.find(y=>y.id===id);if(!x)return;
 try{await db.collection('agreements').doc(id).set({signed_by:s.name,sig:s.png,sw:s.sw,sh:s.sh,signed_at:Date.now(),agreement_no:x.agreement_no,realtor_name:x.full_name})}catch(e){return toast(e.message)}
 if(!quiet){await loadAD();render();toast('Agreement countersigned')}}
async function countersignAll(){const np=AD.people.filter(x=>!AD.ag[x.id]);if(!np.length||!confirm('Countersign '+np.length+' agreement'+(np.length===1?'':'s')+'?'))return;for(const x of np)await countersign(x.id,true);await loadAD();render();toast('Agreements countersigned')}
async function exportMe(){try{const u=au.currentUser,g=async(c,i)=>{const x=await db.collection(c).doc(i).get();return x.exists?x.data():null};
 const [pr,mem,pay,ag,a,b]=await Promise.all([g('profiles',u.uid),g('members',u.uid),g('payouts',u.uid),g('agreements',u.uid),db.collection('sales').where('realtor_id','==',u.uid).get(),db.collection('sales').where('upline_id','==',u.uid).get()]);
 const data={exported_at:new Date().toISOString(),account:{uid:u.uid,email:u.email,email_verified:u.emailVerified},profile:pr,team_record:mem,payout_details:pay,agreement:ag?{...ag,sig:ag.sig?'(signature image omitted)':null}:null,closings_as_realtor:A(a),commission_from_team_closings:A(b).map(x=>({id:x.id,listing_title:x.listing_title,currency:x.currency||'USD',sale_price:x.sale_price,my_commission:x.upline_amt,status:x.status,created:x.created}))};
 const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));l.download='my-bpr-data.json';l.click();toast('Your data has been downloaded')}catch(e){toast(e.message)}}
async function delMe(){if(adm)return toast('Admins cannot delete their account here. Ask another admin to remove your admin access first.');
 if(!confirm('Delete your account permanently? Your profile, payout details, photo and referral code are erased. Closing and commission records are kept for accounting. This cannot be undone.'))return;
 const pw=prompt('Enter your password to confirm');if(!pw)return;
 try{const u=au.currentUser,id=u.uid,code=P.referral_code;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,pw));
  await db.collection('members').doc(id).delete();await db.collection('payouts').doc(id).delete();await db.collection('profiles').doc(id).delete();await db.collection('codes').doc(code).delete();await u.delete()}catch(e){return toast(e.message)}
 P=null;adm=false;S=[];N=[];PAYO=null;AG=null;view='home';tab='dash';render();scrollTo(0,0);toast('Your account has been deleted')}
const LEGAL={privacy:['Privacy Policy',[

terms:['Terms of Use',[

function showLegal(t){const o=$('#lg2');if(o)o.remove();const X=LEGAL[t],d=document.createElement('div');d.id='lg2';d.style.cssText='position:fixed;inset:0;background:var(--bg);z-index:110;overflow-y:auto';
 d.innerHTML=`<div style="position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)"><div class="chips" style="margin:0;padding:0">${Object.keys(LEGAL).map(k=>`<button class="${k===t?'on':''}" onclick="showLegal('${k}')">${LEGAL[k][0]}</button>`).join('')}</div><button class="ib" onclick="$('#lg2').remove()" aria-label="Close">✕</button></div><div style="max-width:720px;margin:0 auto;padding:10px 16px 50px"><h2 style="margin:8px 0 14px">${X[0]}</h2>${X[1].map((q,i)=>`<h3 style="margin-top:18px">${i+1}. ${q[0]}</h3><p style="margin:0;line-height:1.65;color:var(--ink);opacity:.88">${q[1]}</p>`).join('')}</div>`;document.body.appendChild(d)}

async function pdf(){const {jsPDF}=window.jspdf,d=new jsPDF({unit:'pt',format:'a4'});let y=120;
 d.setFillColor(3,105,161);d.rect(0,0,595,84,'F');d.setFillColor(255,255,255);d.roundedRect(46,20,44,44,10,10,'F');
 d.setDrawColor(3,105,161);d.setLineWidth(3);d.line(53,43,68,29);d.line(68,29,83,43);d.setFillColor(3,105,161);d.circle(68,42,2.6,'F');d.circle(60,54,2.6,'F');d.circle(76,54,2.6,'F');d.setLineWidth(1.4);d.line(68,42,60,54);d.line(68,42,76,54);d.line(60,54,76,54);
 d.setTextColor(255);d.setFont('helvetica','bold');d.setFontSize(22);d.text('BPR',102,43);d.setFont('helvetica','normal');d.setFontSize(10);d.text('Bountiful Properties Realtors',102,58);d.setTextColor(20);
 const T=(t,s,b)=>{d.setFont('times',b?'bold':'normal');d.setFontSize(s);const l=d.splitTextToSize(t,495);d.text(l,50,y);y+=l.length*s*1.35+8};
 T('REALTOR COMMISSION AGREEMENT',16,1);T('Agreement No. '+P.agreement_no+'   |   Date: '+fd(P.created),10);y+=6;
 T('This agreement is made between Bountiful Properties (“the Agency”) and '+P.full_name+' of '+(P.country||'')+', '+P.email+' (“the Realtor”).',11);y+=4;
 T('Realtor: '+P.full_name+' (Code '+P.referral_code+')',11,1);T('Upline: '+(P.upline_name||'None (direct to Bountiful Properties)'),11,1);T('Agency: Bountiful Properties',11,1);y+=6;
 ['1. Scope. The Realtor may market and sell properties, ongoing developments and land listed or built by Bountiful Properties, in any country.',
 '2. Commission. On each closed sale, a commission pool of 10% of the sale price is shared as follows: 6% to the selling Realtor, 1% to the upline of the selling Realtor, and 3% to Bountiful Properties.',
 '3. Referrals. The Realtor may invite others through a personal referral link. When an invited Realtor closes a sale, the Realtor earns 1% of that sale price. Where a Realtor has no upline, the 1% upline share is retained by the Agency.',
 '4. Payment. Commission is earned upon closing, meaning full payment received and title or allocation confirmed by Bountiful Properties, and is payable after that confirmation.',
 '5. Conduct. The Realtor shall represent properties truthfully, quote only prices set by Bountiful Properties, and shall not receive client funds directly.',
 '6. Termination. Either party may end this agreement in writing. Commission on sales closed before termination remains payable.'].forEach(c=>T(c,11));
 if(y>680){d.addPage();y=60}
 let rs=null;try{rs=await nameSig(P.full_name)}catch(e){}
 const base=y+72,sg=AG&&AG.sig?AG:null;
 if(rs)d.addImage(rs.url,'PNG',50,base-rs.h-4,rs.w,rs.h);
 d.setFont('times','bold');d.setFontSize(13);d.setTextColor(20);
 if(sg){d.text(sg.signed_by,320,base-24);const nw=d.getTextWidth(sg.signed_by),sh=ASIG_H,sw=Math.min(110,sh*sg.sw/sg.sh);d.addImage(sg.sig,'PNG',320+nw+10,base-sh-2,sw,sh)}
 else{d.setFont('times','italic');d.setFontSize(11);d.setTextColor(110);d.text('Awaiting countersignature by Bountiful Properties',320,base-24);d.setTextColor(20)}
 d.setDrawColor(20);d.setLineWidth(.8);d.line(50,base+4,250,base+4);d.line(320,base+4,520,base+4);
 d.setFont('times','normal');d.setFontSize(10);d.text('Realtor: '+P.full_name,50,base+18);d.text('For Bountiful Properties, Authorised signatory',320,base+18);d.text('Date: '+fd(P.created),50,base+32);if(sg)d.text('Date: '+fd(sg.signed_at),320,base+32);
 d.save('BPR-Agreement-'+P.agreement_no+'.pdf')}
